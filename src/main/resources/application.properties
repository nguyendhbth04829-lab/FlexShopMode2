spring.application.name=FlexShop

# Database Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=FlexShop_V2_Full;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;
spring.datasource.username=sa
spring.datasource.password=sa

# HTTP Servlet Encoding (UTF-8)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Thymeleaf Template Engine Encoding
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html;charset=UTF-8

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=none

# Multipart File Upload (Ảnh và Video bằng chứng)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Upload Directory
app.upload.dir=uploads/khieu-nai/

