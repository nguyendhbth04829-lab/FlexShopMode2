<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>US-41 | Đơn hàng của tôi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --blue:#1565C0; --blue-dark:#0D47A1; --blue-light:#E3F2FD; }
        body { background:#F4F7FC; }
        .topbar { background:linear-gradient(135deg,var(--blue-dark),var(--blue)); color:#fff; border-radius:14px; }
        .card-blue { border:none; border-radius:14px; box-shadow:0 4px 18px rgba(21,101,192,.12); }
        .btn-blue { background:var(--blue); border-color:var(--blue); color:#fff; }
        .btn-blue:hover { background:var(--blue-dark); border-color:var(--blue-dark); color:#fff; }
        .table thead th { background:var(--blue); color:#fff; border:none; }
        .don-card { background:#fff; border-radius:14px; padding:14px; margin-bottom:12px;
                    box-shadow:0 4px 16px rgba(21,101,192,.12); border-left:6px solid var(--blue); }
    </style>
</head>
<body>
<div class="container py-4" style="max-width:960px">
    <div class="topbar p-4 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="mb-1">US-41 · Đơn hàng của tôi</h4>
            <div class="opacity-75">Nhận hàng → bấm xác nhận để hoàn tất + mở đánh giá</div>
        </div>
        <span class="badge bg-light text-primary fs-6" th:text="'Chờ xác nhận: ' + ${donChoXacNhan}">Chờ xác nhận: 0</span>
    </div>

    <div th:if="${param.nhan}" class="alert alert-success">Đã xác nhận nhận hàng — bạn có thể đánh giá sản phẩm!</div>
    <div th:if="${loiNghiepVu}" class="alert alert-danger" th:text="${loiNghiepVu}"></div>

    <!-- PC: bảng -->
    <div class="card card-blue p-0 overflow-hidden d-none d-md-block">
        <table class="table table-hover mb-0 align-middle">
            <thead><tr><th>Mã đơn</th><th>Shop</th><th>Trạng thái</th><th class="text-end">Tổng shop nhận</th><th></th></tr></thead>
            <tbody>
            <tr th:each="d : ${listDon}">
                <td><a th:href="@{/logistics/hanh-trinh(maDon=${d.maDonHangShop})}" style="text-decoration:none"
                       class="fw-bold text-primary" th:text="${d.maCodeDonShop}"></a></td>
                <td th:text="${d.gianHang != null ? d.gianHang.tenGianHang : ''}"></td>
                <td><span class="badge bg-primary" th:text="${d.trangThai}"></span></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(d.tongTienShopNhan,0,'COMMA',0,'POINT')}"></td>
                <td class="text-end">
                    <form th:if="${d.trangThai == 'DA_GIAO'}" method="post" th:action="@{'/khach-hang/don-hang/da-nhan/' + ${d.maDonHangShop}}">
                        <button class="btn btn-blue btn-sm" type="submit">Đã nhận được hàng</button>
                    </form>
                    <a th:if="${d.trangThai == 'HOAN_THANH'}" class="btn btn-outline-primary btn-sm"
                       th:href="@{'/khach-hang/danh-gia/don-hang/' + ${d.maDonHangShop}}">Đánh giá ngay</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(listDon)}"><td colspan="5" class="text-center py-4 text-muted">Chưa có đơn nào.</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Mobile: thẻ -->
    <div class="d-md-none">
        <div th:each="d : ${listDon}" class="don-card">
            <div class="d-flex justify-content-between align-items-center">
                <a th:href="@{/logistics/hanh-trinh(maDon=${d.maDonHangShop})}" style="text-decoration:none">
                    <b class="text-primary" th:text="${d.maCodeDonShop}"></b>
                </a>
                <span class="badge bg-primary" th:text="${d.trangThai}"></span>
            </div>
            <div class="small text-muted" th:text="${d.gianHang != null ? d.gianHang.tenGianHang : ''}"></div>
            <div class="fw-bold mt-1" th:text="${#numbers.formatDecimal(d.tongTienShopNhan,0,'COMMA',0,'POINT')} + ' đ'"></div>
            <form th:if="${d.trangThai == 'DA_GIAO'}" method="post" th:action="@{'/khach-hang/don-hang/da-nhan/' + ${d.maDonHangShop}}" class="mt-2">
                <button class="btn btn-blue w-100" style="min-height:52px;font-weight:700" type="submit">Đã nhận được hàng</button>
            </form>
            <a th:if="${d.trangThai == 'HOAN_THANH'}" class="btn btn-outline-primary w-100 mt-2"
               th:href="@{'/khach-hang/danh-gia/don-hang/' + ${d.maDonHangShop}}">Đánh giá ngay</a>
        </div>
        <div th:if="${#lists.isEmpty(listDon)}" class="alert alert-info">Chưa có đơn nào.</div>
    </div>
</div>
</body>
</html>
