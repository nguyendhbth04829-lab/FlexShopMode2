<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo Lỗi - FlexShop Enterprise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .error-card { max-width: 650px; border-radius: 12px; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="card error-card mx-auto shadow-sm border-0">
        <div class="card-header bg-danger text-white py-3 text-center rounded-top">
            <h4 class="mb-0 fw-bold"><i class="bi bi-exclamation-triangle-fill me-2"></i>Có Lỗi Xảy Ra</h4>
        </div>
        <div class="card-body p-4 text-center">
            <div class="display-4 text-danger fw-bold mb-3" th:text="">400</div>
            <h5 class="card-title text-secondary fw-bold" th:text="">Bad Request</h5>
            <p class="text-muted mb-4" th:text="">
                Tham số truy vấn hoặc đường dẫn không đầy đủ.
            </p>

            <div class="alert alert-warning text-start small mb-4" th:if="">
                <strong><i class="bi bi-link-45deg me-1"></i>Đường dẫn gặp sự cố:</strong> <span th:text="">/thanh-toan/chon-phuong-thuc</span>
            </div>

            <div class="d-flex justify-content-center gap-2">
                <a href="/thanh-toan/danh-sach" class="btn btn-primary">
                    <i class="bi bi-credit-card me-1"></i> Về Danh Sách Thanh Toán
                </a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Quay lại
                </a>
            </div>
        </div>
        <div class="card-footer bg-light text-center py-2 text-muted small">
            FlexShop Enterprise V2 &copy; 2026 - Phân hệ Tài Chính & Thanh Toán
        </div>
    </div>
</div>
</body>
</html>
