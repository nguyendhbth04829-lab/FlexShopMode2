<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Shipper · Giao thành công (POD)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --blue:#1565C0; --blue-dark:#0D47A1; --blue-light:#E3F2FD; }
        body { background:#B0BEC5; }
        .phone { max-width:480px; margin:0 auto; background:#F4F7FC; min-height:100vh;
                 display:flex; flex-direction:column; box-shadow:0 0 24px rgba(0,0,0,.3); }
        .appbar { background:linear-gradient(135deg,var(--blue-dark),var(--blue)); color:#fff;
                  padding:16px; position:sticky; top:0; z-index:10; }
        .content { flex:1; padding:16px; padding-bottom:90px; }
        .card-blue { border:none; border-radius:16px; box-shadow:0 4px 16px rgba(21,101,192,.12);
                     padding:16px; background:#fff; }
        .btn-big { min-height:56px; font-size:1.1rem; font-weight:700; border-radius:14px; }
        .btn-blue { background:var(--blue); border-color:var(--blue); color:#fff; }
        .btn-blue:hover { background:var(--blue-dark); color:#fff; }
        .cod { background:var(--blue-light); border:1px dashed var(--blue); border-radius:10px; }
        #preview { max-width:100%; border-radius:12px; display:none; margin-top:8px; }
        .tabbar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
                  background:#fff; border-top:1px solid #CFD8DC; display:flex; z-index:10; }
        .tabbar a { flex:1; text-align:center; padding:10px 4px 12px; font-size:.75rem; color:#78909C; text-decoration:none; }
        .tabbar a.active { color:var(--blue); font-weight:700; }
        .tabbar .ico { font-size:1.4rem; display:block; }
    </style>
</head>
<body>
<div class="phone">
    <div class="appbar">
        <div class="small opacity-75">US-37 · APP SHIPPER</div>
        <h5 class="mb-0">Giao hàng thành công</h5>
    </div>

    <div class="content">
        <div th:if="${loiNghiepVu}" class="alert alert-danger" th:text="${loiNghiepVu}"></div>

        <div th:if="${nhiemVu != null}" class="card-blue mb-3">
            <div class="d-flex justify-content-between">
                <b class="text-primary" th:text="${nhiemVu.donHangShop != null ? nhiemVu.donHangShop.maCodeDonShop : ''}"></b>
                <span class="badge bg-warning text-dark">ĐANG GIAO</span>
            </div>
            <div class="cod p-2 mt-2">COD cần thu: <b th:text="${#numbers.formatDecimal(nhiemVu.tienCodCanThu,0,'COMMA',0,'POINT')}"></b>
                <span class="small text-muted">(đơn COD tự cộng vào số dư đang giữ)</span>
            </div>
        </div>

        <form th:if="${nhiemVu != null}" method="post" enctype="multipart/form-data"
              th:action="@{'/shipper/pod/' + ${nhiemVu.maNhiemVu}}" th:object="${form}">
            <div class="card-blue mb-3">
                <h6 class="text-primary fw-bold">1 · ẢNH BẰNG CHỨNG (BẮT BUỘC)</h6>
                <input class="form-control" type="file" name="anhPod" accept="image/*" capture="camera"
                       onchange="xemTruoc(this)">
                <img id="preview" alt="Xem trước POD">
                <div class="small text-muted mt-1">Trên điện thoại bấm để mở camera chụp trực tiếp.</div>
            </div>
            <div class="card-blue mb-3">
                <h6 class="text-primary fw-bold">2 · TỌA ĐỘ GIAO HÀNG (WATERMARK)</h6>
                <button type="button" class="btn btn-sm btn-blue mb-2" onclick="layGps()">📍 Lấy GPS</button>
                <button type="button" class="btn btn-sm btn-outline-primary mb-2" onclick="dungToaDoMau()">HN mẫu</button>
                <div class="row g-2">
                    <div class="col-6">
                        <input id="viDo" class="form-control" th:field="*{viDoGiaoHang}" placeholder="Vĩ độ">
                        <div class="text-danger small" th:if="${#fields.hasErrors('viDoGiaoHang')}" th:errors="*{viDoGiaoHang}"></div>
                    </div>
                    <div class="col-6">
                        <input id="kinhDo" class="form-control" th:field="*{kinhDoGiaoHang}" placeholder="Kinh độ">
                        <div class="text-danger small" th:if="${#fields.hasErrors('kinhDoGiaoHang')}" th:errors="*{kinhDoGiaoHang}"></div>
                    </div>
                </div>
                <div id="gpsMsg" class="small text-muted mt-1"></div>
            </div>
            <button class="btn btn-blue btn-big w-100" type="submit">✅ Xác nhận giao thành công</button>
        </form>
    </div>

    <nav class="tabbar">
        <a href="/shipper/trang-thai"><span class="ico">🟢</span>Trạng thái</a>
        <a href="/shipper/don-cho-nhan"><span class="ico">📦</span>Đơn</a>
        <a href="/shipper/cod"><span class="ico">💵</span>COD</a>
        <a href="/shipper/cuoc-cua-toi" class="active"><span class="ico">👤</span>Tôi</a>
    </nav>
</div>
<script>
    function xemTruoc(input){
        const img = document.getElementById('preview');
        if (input.files && input.files[0]){
            img.src = URL.createObjectURL(input.files[0]);
            img.style.display = 'block';
        }
    }
    function dungToaDoMau(){
        document.getElementById('viDo').value = '21.027800';
        document.getElementById('kinhDo').value = '105.834200';
        document.getElementById('gpsMsg').textContent = 'Đã điền tọa độ mẫu Hà Nội.';
    }
    function layGps(){
        const msg = document.getElementById('gpsMsg');
        if (!navigator.geolocation){ msg.textContent = 'Thiết bị không hỗ trợ GPS. Hãy nhập tay.'; return; }
        msg.textContent = 'Đang lấy GPS...';
        navigator.geolocation.getCurrentPosition(
            p => {
                document.getElementById('viDo').value = p.coords.latitude.toFixed(6);
                document.getElementById('kinhDo').value = p.coords.longitude.toFixed(6);
                msg.textContent = 'Đã lấy GPS.';
            },
            e => { msg.textContent = 'Không lấy được GPS. Hãy nhập tay hoặc dùng tọa độ mẫu.'; },
            { enableHighAccuracy:false, timeout:20000, maximumAge:60000 }
        );
    }
</script>
</body>
</html>
