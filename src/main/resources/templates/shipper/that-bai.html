<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Shipper · Báo giao thất bại</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --blue:#1565C0; --blue-dark:#0D47A1; --blue-light:#E3F2FD; }
        body { background:#B0BEC5; }
        .phone { max-width:480px; margin:0 auto; background:#F4F7FC; min-height:100vh;
                 display:flex; flex-direction:column; box-shadow:0 0 24px rgba(0,0,0,.3); }
        .appbar { background:linear-gradient(135deg,var(--blue-dark),var(--blue)); color:#fff;
                  padding:16px; position:sticky; top:0; z-index:10; }
        .content { flex:1; padding:16px; padding-bottom:90px; }
        .card-blue { border:none; border-radius:16px; box-shadow:0 4px 16px rgba(21,101,192,.12);
                     padding:16px; background:#fff; }
        .btn-big { min-height:56px; font-size:1.1rem; font-weight:700; border-radius:14px; }
        .btn-blue { background:var(--blue); border-color:var(--blue); color:#fff; }
        .btn-blue:hover { background:var(--blue-dark); color:#fff; }
        .lan-badge { background:var(--blue-light); color:var(--blue-dark); border:1px solid #90CAF9;
                     border-radius:10px; font-weight:700; }
        .tabbar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
                  background:#fff; border-top:1px solid #CFD8DC; display:flex; z-index:10; }
        .tabbar a { flex:1; text-align:center; padding:10px 4px 12px; font-size:.75rem; color:#78909C; text-decoration:none; }
        .tabbar a.active { color:var(--blue); font-weight:700; }
        .tabbar .ico { font-size:1.4rem; display:block; }
    </style>
</head>
<body>
<div class="phone">
    <div class="appbar">
        <div class="small opacity-75">US-38 · APP SHIPPER</div>
        <h5 class="mb-0">Báo giao thất bại</h5>
    </div>

    <div class="content">
        <div th:if="${loiNghiepVu}" class="alert alert-danger" th:text="${loiNghiepVu}"></div>

        <div th:if="${nhiemVu != null}" class="card-blue mb-3">
            <div class="d-flex justify-content-between align-items-center">
                <b class="text-primary" th:text="${nhiemVu.donHangShop != null ? nhiemVu.donHangShop.maCodeDonShop : ''}"></b>
                <span class="lan-badge p-2" th:text="'Đang giao lần ' + ${nhiemVu.soLanGiao} + '/3'">Lần 1/3</span>
            </div>
            <div class="small text-muted mt-1">Tối đa 3 lần — hết 3 lần đơn chờ chuyển hoàn (US-40).</div>
        </div>

        <form th:if="${nhiemVu != null}" method="post"
              th:action="@{'/shipper/that-bai/' + ${nhiemVu.maNhiemVu}}" th:object="${form}">
            <div class="card-blue mb-3">
                <label class="form-label fw-bold text-primary">Lý do thất bại *</label>
                <select class="form-select form-select-lg" th:field="*{lyDoThatBai}" onchange="toggleHen(this.value)">
                    <option value="">-- Chọn lý do --</option>
                    <option value="KHACH_KHONG_NGHE_MAY">Khách không nghe máy</option>
                    <option value="SAI_DIA_CHI">Sai địa chỉ</option>
                    <option value="HEN_LAI">Khách hẹn giao lại</option>
                    <option value="KHACH_TU_CHOI">Khách từ chối nhận</option>
                    <option value="KHAC">Lý do khác</option>
                </select>
                <div class="text-danger small" th:if="${#fields.hasErrors('lyDoThatBai')}" th:errors="*{lyDoThatBai}"></div>
                <div id="henBox" class="mt-3" style="display:none">
                    <label class="form-label fw-bold text-primary">Hẹn giao lại lúc *</label>
                    <input class="form-control form-control-lg" type="datetime-local" th:field="*{thoiGianHenGiaoLai}">
                </div>
            </div>
            <button class="btn btn-blue btn-big w-100" type="submit">Gửi báo cáo</button>
        </form>
    </div>

    <nav class="tabbar">
        <a href="/shipper/trang-thai"><span class="ico">🟢</span>Trạng thái</a>
        <a href="/shipper/don-cho-nhan"><span class="ico">📦</span>Đơn</a>
        <a href="/shipper/cod"><span class="ico">💵</span>COD</a>
        <a href="/shipper/cuoc-cua-toi" class="active"><span class="ico">👤</span>Tôi</a>
    </nav>
</div>
<script>
    function toggleHen(v){ document.getElementById('henBox').style.display = (v === 'HEN_LAI') ? 'block' : 'none'; }
</script>
</body>
</html>
