<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Shipper · Đơn chờ nhận</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --blue:#1565C0; --blue-dark:#0D47A1; --blue-light:#E3F2FD; }
        body { background:#B0BEC5; }
        .phone { max-width:480px; margin:0 auto; background:#F4F7FC; min-height:100vh;
                 display:flex; flex-direction:column; box-shadow:0 0 24px rgba(0,0,0,.3); }
        .appbar { background:linear-gradient(135deg,var(--blue-dark),var(--blue)); color:#fff;
                  padding:16px; position:sticky; top:0; z-index:10; }
        .content { flex:1; padding:16px; padding-bottom:90px; }
        .cuoc { background:#fff; border-radius:16px; padding:14px; margin-bottom:12px;
                box-shadow:0 4px 16px rgba(21,101,192,.12); border-left:6px solid var(--blue); }
        .btn-big { min-height:52px; font-size:1.05rem; font-weight:700; border-radius:14px; }
        .btn-blue { background:var(--blue); border-color:var(--blue); color:#fff; }
        .btn-blue:hover { background:var(--blue-dark); color:#fff; }
        .cod { background:var(--blue-light); border:1px dashed var(--blue); border-radius:10px; }
        .tabbar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
                  background:#fff; border-top:1px solid #CFD8DC; display:flex; z-index:10; }
        .tabbar a { flex:1; text-align:center; padding:10px 4px 12px; font-size:.75rem; color:#78909C; text-decoration:none; }
        .tabbar a.active { color:var(--blue); font-weight:700; }
        .tabbar .ico { font-size:1.4rem; display:block; }
    </style>
</head>
<body>
<div class="phone">
    <div class="appbar">
        <div class="small opacity-75">US-35 · APP SHIPPER</div>
        <h5 class="mb-0">Đơn chờ nhận</h5>
    </div>

    <div class="content">
        <div th:if="${param.nhan}" class="alert alert-success">Nhận cuốc thành công!</div>
        <div th:if="${loiNghiepVu}" class="alert alert-danger" th:text="${loiNghiepVu}"></div>

        <div th:if="${shipper != null && !duocNhanDon}" class="alert alert-warning">
            Bạn đang Offline — <a href="/shipper/trang-thai">bật làm việc</a> mới nhận được đơn.
        </div>

        <div th:each="d : ${listDon}" class="cuoc">
            <div class="d-flex justify-content-between">
                <b class="text-primary" th:text="${d.maCodeDonShop}">SHOP-001</b>
                <span class="badge bg-primary" th:text="${d.trangThai}">DA_XAC_NHAN</span>
            </div>
            <div class="mt-2"><b>🏠 Lấy hàng:</b>
                <span th:text="${d.gianHang != null ? d.gianHang.diaChiKho : ''}"></span>
                (<span th:text="${d.gianHang != null ? d.gianHang.sdtKho : ''}"></span>)
            </div>
            <div><b>📍 Giao tới:</b>
                <span th:text="${d.donHangTong != null && d.donHangTong.diaChiGiao != null
                    ? d.donHangTong.diaChiGiao.diaChiChiTiet + ', ' + d.donHangTong.diaChiGiao.quanHuyen + ', ' + d.donHangTong.diaChiGiao.tinhThanh : ''}"></span>
            </div>
            <div class="cod p-2 mt-2 d-flex justify-content-between">
                <span>Vận đơn: <b th:text="${d.maVanDon != null ? d.maVanDon : '(chưa có)'}"></b></span>
                <span>COD: <b th:text="${#numbers.formatDecimal(d.tongTienShopNhan,0,'COMMA',0,'POINT')}"></b></span>
            </div>
            <form method="post" th:action="@{'/shipper/nhan-don/' + ${d.maDonHangShop}}" class="mt-2">
                <button class="btn btn-blue btn-big w-100" type="submit"
                        th:disabled="${!duocNhanDon}">Nhận cuốc này</button>
            </form>
        </div>
        <div th:if="${#lists.isEmpty(listDon)}" class="alert alert-info">Không còn đơn chờ nhận.</div>

        <nav th:if="${tongTrang != null && tongTrang > 1}" class="d-flex justify-content-between align-items-center mt-2">
            <a class="btn btn-outline-primary" th:if="${trangHienTai > 0}"
               th:href="@{/shipper/don-cho-nhan(page=${trangHienTai - 1})}">← Trước</a>
            <span th:unless="${trangHienTai > 0}"></span>
            <span class="text-muted" th:text="'Trang ' + (${trangHienTai + 1}) + '/' + ${tongTrang}">Trang 1/1</span>
            <a class="btn btn-outline-primary" th:if="${trangHienTai + 1 < tongTrang}"
               th:href="@{/shipper/don-cho-nhan(page=${trangHienTai + 1})}">Sau →</a>
            <span th:unless="${trangHienTai + 1 < tongTrang}"></span>
        </nav>

        <h6 class="text-primary fw-bold mt-4 mb-2">CUỐC CỦA TÔI</h6>
        <div th:each="n : ${cuocCuaToi}" class="cuoc" style="border-left-color:#2E7D32">
            <div class="d-flex justify-content-between">
                <b th:text="${n.donHangShop != null ? n.donHangShop.maCodeDonShop : ''}"></b>
                <span class="badge bg-success" th:text="${n.trangThaiDisplay}"></span>
            </div>
        </div>
        <div th:if="${cuocCuaToi != null && #lists.isEmpty(cuocCuaToi)}" class="text-muted small">Bạn chưa nhận cuốc nào.</div>
    </div>

    <nav class="tabbar">
        <a href="/shipper/trang-thai"><span class="ico">🟢</span>Trạng thái</a>
        <a href="/shipper/don-cho-nhan" class="active"><span class="ico">📦</span>Đơn</a>
        <a href="#"><span class="ico">💵</span>COD</a>
        <a href="/shipper/cuoc-cua-toi"><span class="ico">👤</span>Tôi</a>
    </nav>
</div>
</body>
</html>
