<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>US-33 | Hành trình qua Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --blue:#1565C0; --blue-dark:#0D47A1; --blue-light:#E3F2FD; }
        body { background:#F4F7FC; }
        .topbar { background:linear-gradient(135deg,var(--blue-dark),var(--blue)); color:#fff; border-radius:14px; }
        .card-blue { border:none; border-radius:14px; box-shadow:0 4px 18px rgba(21,101,192,.12); }
        .btn-blue { background:var(--blue); border-color:var(--blue); color:#fff; }
        .btn-blue:hover { background:var(--blue-dark); border-color:var(--blue-dark); color:#fff; }
        .timeline { position:relative; padding-left:26px; }
        .timeline::before { content:''; position:absolute; left:8px; top:6px; bottom:6px; width:3px; background:var(--blue-light); border-radius:2px; }
        .moc { position:relative; background:#fff; border-radius:12px; padding:12px 14px; margin-bottom:12px; box-shadow:0 2px 10px rgba(21,101,192,.10); }
        .moc::before { content:''; position:absolute; left:-24px; top:16px; width:14px; height:14px; border-radius:50%; background:var(--blue); border:3px solid #fff; box-shadow:0 0 0 2px var(--blue); }
        .hub-badge { background:var(--blue-light); color:var(--blue-dark); border:1px solid #90CAF9; }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="topbar p-4 mb-4">
        <h4 class="mb-1">US-33 · Định tuyến kiện hàng qua Hub trung chuyển</h4>
        <div class="opacity-75">Ghi nhận mốc: Đã rời Hub / Đang nhập Hub · Timeline mới nhất trước</div>
    </div>

    <div class="card card-blue p-3 mb-4">
        <form method="get" th:action="@{/logistics/hanh-trinh}" class="row g-2">
            <div class="col-md-9">
                <select class="form-select" name="maDon" onchange="this.form.submit()">
                    <option value="">-- Chọn đơn shop để xem hành trình --</option>
                    <option th:each="d : ${listDon}" th:value="${d.maDonHangShop}"
                            th:selected="${maDon != null && maDon == d.maDonHangShop}"
                            th:text="${d.maCodeDonShop} + ' (' + ${d.trangThai} + ')'"></option>
                </select>
            </div>
            <div class="col-md-3 d-grid">
                <button class="btn btn-blue" type="submit">Xem hành trình</button>
            </div>
        </form>
    </div>

    <div class="row g-4" th:if="${maDon != null}">
        <div class="col-md-5">
            <div class="card card-blue p-4">
                <h6 class="text-primary fw-bold mb-3">GHI MỐC MỚI</h6>
                <form method="post" th:action="@{/logistics/hanh-trinh/ghi-moc}" th:object="${form}">
                    <input type="hidden" th:field="*{maDonHangShop}">
                    <div class="mb-2">
                        <label class="form-label">Hub trung chuyển (để trống nếu chưa qua Hub)</label>
                        <select class="form-select" th:field="*{maHub}">
                            <option value="">-- Chưa qua Hub --</option>
                            <option th:each="h : ${listHub}" th:value="${h.maHub}" th:text="${h.tenHub} + ' · ' + ${h.tinhThanh}"></option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Tiêu đề mốc</label>
                        <input class="form-control" th:field="*{tieuDeMoc}" placeholder="vd Đang nhập Hub, Đã rời Hub">
                        <div class="text-danger small" th:if="${#fields.hasErrors('tieuDeMoc')}" th:errors="*{tieuDeMoc}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Vị trí hiện tại</label>
                        <input class="form-control" th:field="*{viTriHienTai}" placeholder="vd Kho phân loại Hà Nội">
                    </div>
                    <button class="btn btn-blue w-100" type="submit">Ghi mốc</button>
                </form>
                <div th:if="${loiNghiepVu}" class="alert alert-danger mt-3" th:text="${loiNghiepVu}"></div>
            </div>
        </div>
        <div class="col-md-7">
            <h6 class="text-primary fw-bold mb-3" th:text="'TIMELINE · ' + ${donChon != null ? donChon.maCodeDonShop : ''}">TIMELINE</h6>
            <div class="timeline">
                <div class="moc" th:each="m : ${timeline}">
                    <div class="fw-bold" th:text="${m.tieuDeMoc}">Mốc</div>
                    <div><span class="badge hub-badge" th:if="${m.hub != null}" th:text="${m.hub.tenHub}"></span>
                        <span class="text-muted small" th:if="${m.hub == null}">Chưa qua Hub</span></div>
                    <div class="small text-muted" th:text="${m.viTriHienTai}"></div>
                    <div class="small text-muted" th:text="${#temporals.format(m.thoiGian,'dd/MM/yyyy HH:mm')}"></div>
                </div>
                <div th:if="${#lists.isEmpty(timeline)}" class="alert alert-info">Kiện hàng chưa có mốc nào — hãy ghi mốc đầu tiên.</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
