<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Admin Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background-color: #343a40; color: white; padding-top: 20px; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 10px 20px; display: block; }
        .sidebar a:hover, .sidebar a.active { color: white; background-color: #495057; border-left: 3px solid #0d6efd; }
        .main-content { padding: 30px; }
        .card { box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,.075); border: none; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar d-none d-md-block">
                <h4 class="text-center mb-4 text-white"><i class="fas fa-store me-2"></i>FlexShop</h4>
                <a href="/admin/danh-muc" th:classappend="${title == 'Danh mục'} ? 'active'"><i class="fas fa-list me-2"></i>Danh mục</a>
                <a href="/admin/thuong-hieu" th:classappend="${title == 'Thương hiệu'} ? 'active'"><i class="fas fa-copyright me-2"></i>Thương hiệu</a>
                <a href="/seller/san-pham" th:classappend="${title == 'Sản phẩm'} ? 'active'"><i class="fas fa-box-open me-2"></i>Sản phẩm</a>
                <!-- Thêm các link khác sau -->
            </div>
            
            <!-- Main Content -->
            <div class="col-md-10 main-content">
                <!-- Hiển thị thông báo chung -->
                <div th:if="${thongBaoThanhCong}" class="alert alert-success alert-dismissible fade show">
                    <i class="fas fa-check-circle me-2"></i><span th:text="${thongBaoThanhCong}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${thongBaoLoi}" class="alert alert-danger alert-dismissible fade show">
                    <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${thongBaoLoi}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <!-- Nội dung trang -->
                <div th:replace="${content}"></div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
