<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>US-31 | Phiếu A6 hàng loạt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <style>
        :root { --blue:#1565C0; --blue-dark:#0D47A1; }
        body { background:#E3F2FD; }
        .toolbar { background:linear-gradient(135deg,#0D47A1,#1565C0); color:#fff; border-radius:12px; }
        .btn-blue { background:var(--blue); border-color:var(--blue); color:#fff; }
        .phieu { width:105mm; min-height:148mm; background:#fff; border-radius:8px;
                 padding:10px 12px; margin:12px auto; border-top:8px solid var(--blue);
                 box-shadow:0 4px 16px rgba(21,101,192,.18); color:#111; }
        .phieu h5 { color:var(--blue-dark); font-weight:800; }
        .ma-van-don { background:#E3F2FD; border:1px dashed var(--blue); border-radius:8px; padding:6px; text-align:center; }
        svg.barcode { width:100%; height:60px; }
        @page { size:A6 portrait; margin:5mm; }
        @media print {
            body { background:#fff; }
            .no-print { display:none !important; }
            .phieu { box-shadow:none; border:1px solid #000; border-top:6px solid #000; margin:0 auto 8px auto; page-break-after:always; border-radius:0; }
        }
    </style>
</head>
<body>
<div class="container py-3 no-print">
    <div class="toolbar p-3 d-flex justify-content-between align-items-center">
        <div><b>US-31 · Phiếu A6 hàng loạt</b> · <span th:text="'Số phiếu: ' + ${#lists.size(danhSachIn)}">0</span></div>
        <div>
            <button class="btn btn-light fw-bold" onclick="window.print()">🖨️ In tất cả (A6)</button>
            <a class="btn btn-outline-light" th:href="@{/seller/van-don}">Quay lại</a>
        </div>
    </div>
</div>

<div th:if="${#lists.isEmpty(danhSachIn)}" class="container no-print"><div class="alert alert-warning">Không có phiếu nào (đơn khác shop đã bị lọc).</div></div>

<div th:each="d : ${danhSachIn}" class="phieu">
    <h5 class="text-center mb-1">FLEXSHOP · PHIẾU GIAO HÀNG</h5>
    <div class="text-center small text-muted mb-2">US-31 · Khổ A6 nhiệt · Bàn giao 3PL</div>
    <div class="ma-van-don mb-2">
        <div class="small text-muted">MÃ VẬN ĐƠN</div>
        <div class="fw-bold" th:text="${d.maVanDon}">FS-000000</div>
        <svg class="barcode" th:attr="data-value=${d.maVanDon}"></svg>
    </div>
    <p class="mb-1"><b>Mã đơn:</b> <span th:text="${d.maCodeDonShop}"></span></p>
    <p class="mb-1"><b>Shop:</b> <span th:text="${d.gianHang != null ? d.gianHang.tenGianHang : ''}"></span></p>
    <p class="mb-1"><b>Người nhận:</b>
        <span th:text="${d.donHangTong != null && d.donHangTong.diaChiGiao != null ? d.donHangTong.diaChiGiao.tenNguoiNhan : ''}"></span>
        (<span th:text="${d.donHangTong != null && d.donHangTong.diaChiGiao != null ? d.donHangTong.diaChiGiao.soDienThoai : ''}"></span>)
    </p>
    <p class="mb-1"><b>Địa chỉ:</b>
        <span th:text="${d.donHangTong != null && d.donHangTong.diaChiGiao != null
            ? d.donHangTong.diaChiGiao.diaChiChiTiet + ', ' + d.donHangTong.diaChiGiao.xaPhuong + ', ' + d.donHangTong.diaChiGiao.quanHuyen + ', ' + d.donHangTong.diaChiGiao.tinhThanh : ''}"></span>
    </p>
    <p class="mb-1"><b>Hàng:</b></p>
    <ul class="mb-2">
        <li th:each="ct : ${mapChiTiet[d.maDonHangShop]}"
            th:text="${ct.tenSanPham} + ' x' + ${ct.soLuong} + ' - ' + ${ct.tongTien}"></li>
    </ul>
    <p class="mb-1"><b>Thu hộ COD:</b> <span class="fw-bold" th:text="${d.tongTienShopNhan}"></span></p>
    <p class="mb-0"><b>Trạng thái:</b> <span th:text="${d.trangThai}"></span></p>
    <p class="text-center mt-2 small">✦ Cảm ơn quý khách ✦</p>
</div>

<script>
    document.querySelectorAll('svg.barcode').forEach(s => {
        try { JsBarcode(s, s.getAttribute('data-value'), {format:'CODE128', displayValue:false, margin:0}); }
        catch(e){ s.outerHTML = '<div>'+s.getAttribute('data-value')+'</div>'; }
    });
</script>
</body>
</html>
